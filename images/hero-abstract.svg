<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A4A"/>
      <stop offset="50%" style="stop-color:#264E40"/>
      <stop offset="100%" style="stop-color:#1E3D32"/>
    </linearGradient>
    
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0CFA0"/>
      <stop offset="50%" style="stop-color:#C4A962"/>
      <stop offset="100%" style="stop-color:#B89B4F"/>
    </linearGradient>
    
    <!-- Warm glow -->
    <radialGradient id="warmGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#C4A962;stop-opacity:0.25"/>
      <stop offset="70%" style="stop-color:#C4A962;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#C4A962;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Soft white glow -->
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E3D32" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Ambient glow circles -->
  <ellipse cx="200" cy="180" rx="180" ry="150" fill="url(#warmGlow)"/>
  <circle cx="320" cy="100" r="80" fill="url(#softGlow)"/>
  <circle cx="80" cy="400" r="100" fill="url(#softGlow)"/>
  
  <!-- Decorative curved lines - flowing, organic -->
  <g stroke="rgba(255,255,255,0.08)" fill="none" stroke-width="1">
    <path d="M0 150 Q100 100 200 150 T400 120"/>
    <path d="M0 200 Q100 150 200 200 T400 170"/>
    <path d="M0 350 Q100 300 200 350 T400 320"/>
    <path d="M0 400 Q100 350 200 400 T400 370"/>
  </g>
  
  <!-- Main illustration group - centered -->
  <g transform="translate(200, 230)">
    
    <!-- Outer decorative ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="8 4"/>
    
    <!-- Cupped hands - elegant, symmetrical -->
    <g filter="url(#softShadow)">
      <!-- Left hand -->
      <path d="M-85 50 
               C-95 30 -90 0 -75 -15
               C-60 -30 -40 -35 -20 -25
               C-5 -18 5 -5 5 15
               C5 35 -15 55 -40 65
               C-60 72 -80 65 -85 50Z" 
            fill="rgba(255,255,255,0.12)"
            stroke="rgba(255,255,255,0.25)"
            stroke-width="1.5"/>
      
      <!-- Right hand -->
      <path d="M85 50 
               C95 30 90 0 75 -15
               C60 -30 40 -35 20 -25
               C5 -18 -5 -5 -5 15
               C-5 35 15 55 40 65
               C60 72 80 65 85 50Z" 
            fill="rgba(255,255,255,0.12)"
            stroke="rgba(255,255,255,0.25)"
            stroke-width="1.5"/>
    </g>
    
    <!-- Central heart - held by hands -->
    <g transform="translate(0, -20)">
      <!-- Heart glow -->
      <path d="M0 -35 
               C-18 -55 -50 -55 -50 -22
               C-50 12 0 50 0 50
               C0 50 50 12 50 -22
               C50 -55 18 -55 0 -35Z"
            fill="url(#warmGlow)"
            transform="scale(1.2)"/>
      
      <!-- Main heart -->
      <path d="M0 -30 
               C-15 -48 -42 -48 -42 -18
               C-42 10 0 42 0 42
               C0 42 42 10 42 -18
               C42 -48 15 -48 0 -30Z"
            fill="url(#goldGrad)"
            filter="url(#softShadow)"/>
      
      <!-- Heart shine -->
      <path d="M-20 -28 
               C-28 -38 -32 -38 -32 -22
               C-32 -12 -25 -5 -20 -5"
            fill="none"
            stroke="rgba(255,255,255,0.4)"
            stroke-width="3"
            stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- House icon - above the hands -->
  <g transform="translate(200, 85)">
    <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Roof -->
      <path d="M0 -22 L-28 3 L-23 3 L-23 28 L23 28 L23 3 L28 3 Z"/>
      <!-- Door -->
      <rect x="-7" y="8" width="14" height="20" rx="2"/>
      <!-- Door handle -->
      <circle cx="4" cy="18" r="1.5" fill="url(#goldGrad)"/>
    </g>
  </g>
  
  <!-- Floating hearts - scattered -->
  <g fill="url(#goldGrad)">
    <!-- Top area -->
    <path transform="translate(85, 130) scale(0.45)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.7"/>
    <path transform="translate(315, 145) scale(0.5)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.6"/>
    
    <!-- Middle area -->
    <path transform="translate(55, 250) scale(0.35)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.5"/>
    <path transform="translate(345, 260) scale(0.4)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.55"/>
    
    <!-- Bottom area -->
    <path transform="translate(90, 380) scale(0.38)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.5"/>
    <path transform="translate(310, 395) scale(0.42)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.6"/>
    <path transform="translate(200, 420) scale(0.32)" d="M0 -10 C-5 -15 -14 -15 -14 -6 C-14 4 0 14 0 14 C0 14 14 4 14 -6 C14 -15 5 -15 0 -10Z" opacity="0.45"/>
  </g>
  
  <!-- Sparkle dots -->
  <g fill="rgba(255,255,255,0.15)">
    <circle cx="120" cy="100" r="2"/>
    <circle cx="280" cy="90" r="2.5"/>
    <circle cx="60" cy="180" r="1.5"/>
    <circle cx="340" cy="190" r="2"/>
    <circle cx="45" cy="320" r="2"/>
    <circle cx="355" cy="340" r="1.5"/>
    <circle cx="150" cy="440" r="2"/>
    <circle cx="250" cy="450" r="1.5"/>
  </g>
  
  <!-- Bottom tagline -->
  <text x="200" y="475" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Georgia, serif" font-size="13" letter-spacing="3">
    CARE · COMFORT · HOME
  </text>
</svg>
